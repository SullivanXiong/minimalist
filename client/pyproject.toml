[project]
name = "client"
version = "0.1.0"
description = "wxPython client for Minimalist project management"
requires-python = ">=3.11"
dependencies = [
    "wxPython>=4.2.0",
    "websocket-client>=1.8.0",
    "requests>=2.31.0",
    "supyx>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "Pillow>=10.0",
]

[tool.uv.sources]
supyx = { path = "../../supyx", editable = true }
