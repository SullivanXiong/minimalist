name: Desktop Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: Minimalist-macOS
            ext: .app
          - os: windows-latest
            artifact: Minimalist-Windows
            ext: .exe
          - os: ubuntu-latest
            artifact: Minimalist-Linux
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Linux: install wxPython build deps
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install client dependencies
        run: cd client && uv sync

      - name: Install PyInstaller
        run: cd client && uv pip install pyinstaller

      - name: Build executable
        run: |
          cd client
          uv run pyinstaller \
            --name Minimalist \
            --windowed \
            --onefile \
            --hidden-import supyx \
            --hidden-import supyx.wxnavimgation \
            app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: client/dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
